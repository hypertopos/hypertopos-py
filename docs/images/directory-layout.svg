<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="dirl-title dirl-desc">
<title id="dirl-title">Sphere directory layout</title>
<desc id="dirl-desc">A sphere is one directory of Lance datasets: _gds_meta holds sphere.json and metadata sidecars including branches; points holds one dataset per line version; geometry holds delta vectors per pattern with an IVF_FLAT index and calibration epochs as Lance version tags; edges holds anchor-to-anchor edge tables; temporal holds snapshots over time.</desc>
<defs>
<linearGradient id="dirl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
<radialGradient id="dirl-glow"><stop offset="0%" stop-color="#4808FC" stop-opacity="0.55"/><stop offset="100%" stop-color="#4808FC" stop-opacity="0"/></radialGradient>
</defs>
<rect width="900" height="520" rx="14" fill="url(#dirl-bg)" stroke="#230C7C" stroke-width="1.5"/>
<rect x="345" y="16" width="210" height="36" rx="10" fill="#130D47" stroke="#6D39FD" stroke-width="1.5"/>
<text x="450" y="40" font-size="14" fill="#DACEFE" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gds_{sphere_id}/</text>
<line x1="450" y1="52" x2="450" y2="72" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
<line x1="121" y1="72" x2="812" y2="72" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
<line x1="121" y1="72" x2="121" y2="92" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
<rect x="16" y="92" width="210" height="356" rx="8" fill="#0f2040" stroke="#230C7C" stroke-width="1"/>
<text x="121" y="116" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">_gds_meta/</text>
<line x1="26" y1="126" x2="216" y2="126" stroke="#230C7C" stroke-width="1"/>
<line x1="318" y1="72" x2="318" y2="92" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
<rect x="238" y="92" width="160" height="356" rx="8" fill="#0f2040" stroke="#230C7C" stroke-width="1"/>
<text x="318" y="116" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">points/</text>
<line x1="248" y1="126" x2="388" y2="126" stroke="#230C7C" stroke-width="1"/>
<line x1="490" y1="72" x2="490" y2="92" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
<rect x="410" y="92" width="160" height="356" rx="8" fill="#0f2040" stroke="#230C7C" stroke-width="1"/>
<text x="490" y="116" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">geometry/</text>
<line x1="420" y1="126" x2="560" y2="126" stroke="#230C7C" stroke-width="1"/>
<line x1="655" y1="72" x2="655" y2="92" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
<rect x="582" y="92" width="146" height="356" rx="8" fill="#0f2040" stroke="#230C7C" stroke-width="1"/>
<text x="655" y="116" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">edges/</text>
<line x1="592" y1="126" x2="718" y2="126" stroke="#230C7C" stroke-width="1"/>
<line x1="812" y1="72" x2="812" y2="92" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>
<rect x="740" y="92" width="144" height="356" rx="8" fill="#0f2040" stroke="#230C7C" stroke-width="1"/>
<text x="812" y="116" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">temporal/</text>
<line x1="750" y1="126" x2="874" y2="126" stroke="#230C7C" stroke-width="1"/>
<rect x="26" y="136" width="190" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="121" y="151" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sphere.json</text>
<text x="121" y="170" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">lines, patterns, aliases — read on open</text>
<rect x="26" y="180" width="190" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="121" y="195" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">geometry_stats/</text>
<text x="121" y="214" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">precomputed population summaries</text>
<rect x="26" y="224" width="190" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="121" y="239" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">trajectory/</text>
<text x="121" y="258" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">trajectory vectors, optional ANN index</text>
<rect x="26" y="268" width="190" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="121" y="283" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">temporal_centroids/</text>
<text x="121" y="302" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">population centroids per time window</text>
<rect x="26" y="312" width="190" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="121" y="327" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">edge_stats/ · edge_features/</text>
<text x="121" y="346" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">edge table summaries, per-edge dims</text>
<rect x="26" y="356" width="190" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="121" y="371" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">contagion_stats/</text>
<text x="121" y="390" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">neighbour anomaly counts per entity</text>
<rect x="26" y="400" width="190" height="22" rx="5" fill="#130D47" stroke="#6D39FD" stroke-width="1.2"/>
<text x="121" y="415" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">branches/{branch}/</text>
<text x="121" y="434" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">branch.json + _gds_meta/ overlay</text>
<rect x="248" y="136" width="140" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="318" y="151" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{line_id}/v={n}/</text>
<text x="318" y="170" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">data.lance — entity records</text>
<text x="318" y="182" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">one dataset per line version</text>
<rect x="248" y="200" width="140" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="318" y="215" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BTREE · INVERTED</text>
<text x="318" y="234" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">primary_key lookup</text>
<text x="318" y="246" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">full-text on non-event lines</text>
<rect x="420" y="136" width="140" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="490" y="151" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{pattern_id}/data.lance</text>
<text x="490" y="170" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">delta vectors, edges, norms</text>
<text x="490" y="182" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">anomaly flags, rank percentiles</text>
<rect x="420" y="200" width="140" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="490" y="215" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IVF_FLAT ANN index</text>
<text x="490" y="234" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">similarity search over δ</text>
<rect x="420" y="252" width="140" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="490" y="267" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">epoch_&lt;N&gt; tags</text>
<text x="490" y="286" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">one Lance version tag</text>
<text x="490" y="298" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">per calibration epoch</text>
<rect x="592" y="136" width="126" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="655" y="151" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{pattern_id}/data.lance</text>
<text x="655" y="170" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">anchor-to-anchor edges</text>
<text x="655" y="182" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">BTREE indexed</text>
<text x="655" y="194" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">event patterns with</text>
<text x="655" y="206" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">an edge table</text>
<rect x="750" y="136" width="124" height="22" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="812" y="151" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{pattern_id}/data.lance</text>
<text x="812" y="170" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">shape and delta snapshots</text>
<text x="812" y="182" font-size="8.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">per entity, per window</text>
<text x="450" y="472" font-size="10" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">Every dataset is a Lance dataset (file format 2.2); points/ keeps one v={n} directory per line version.</text>
<text x="450" y="490" font-size="10" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">A branch copies no data: geometry and temporal centroids get a native Lance branch; every other dataset</text>
<text x="450" y="505" font-size="10" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">stays pinned at the version current when the branch was created.</text>
</svg>
