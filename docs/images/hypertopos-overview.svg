<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="ovw-title ovw-desc">
<title id="ovw-title">hypertopos overview</title>
<desc id="ovw-desc">Relational tables are built into a geometric data sphere: every entity is a point placed by its delta vector from the population centre μ; points beyond the threshold θ are anomalous. Agents navigate the sphere through MCP or Python with movement, attraction and temporal primitives and analysis tools. Positions in this picture are illustrative.</desc>
