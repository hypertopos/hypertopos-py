[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypertopos"
version = "0.10.3"
description = "Understand the structure of your data — without training machine learning models"
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE.md"]
keywords = ["anomaly-detection", "geometry", "ai-agents", "mcp", "lance", "arrow", "aml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pyarrow>=14.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pylance>=14.0,<15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graph = [
    "igraph>=0.11",
]
topology = [
    "ripser>=0.6.14",
    "persim>=0.3.5",
    "scikit-learn>=1.3",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "filelock",
    "ruff==0.15.2",
    "mypy==1.19.1",
    "igraph>=0.11",
    "pyspark>=3.5,<3.6",
    "setuptools; python_version >= '3.12'",
]
spark = [
    # Spark 3.5 (DBR 14-16) and Spark 4 (DBR 17, serverless): never downgrade the platform's PySpark.
    "pyspark>=3.5,<5",
    # pyspark 3.5 imports distutils, which Python 3.12 dropped; setuptools provides it.
    "setuptools; python_version >= '3.12'",
]
mcp = [
    "mcp[cli]>=2.3,<3",
    "tzdata>=2024.1",
]

[project.scripts]
hypertopos = "hypertopos.cli.main:main"

[[project.authors]]
name = "Karol Kędzia"

[project.urls]
Homepage = "https://github.com/hypertopos/hypertopos-py"
Documentation = "https://github.com/hypertopos/hypertopos-py/tree/main/docs"
Repository = "https://github.com/hypertopos/hypertopos-py"
Issues = "https://github.com/hypertopos/hypertopos-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["hypertopos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: tests dominated by process start-up or large synthetic builds (deselect locally with -m 'not slow')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true

# Third-party libraries that ship without type stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = [
    "igraph.*",
    "networkx.*",
    "pandas.*",
    "pyarrow.*",
    "pyspark.*",
    "ripser.*",
    "scipy.*",
    "sklearn.*",
    "yaml.*",
]
ignore_missing_imports = true
