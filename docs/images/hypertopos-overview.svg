<radialGradient id="ovw-glow"><stop offset="0%" stop-color="#4808FC" stop-opacity="0.55"/><stop offset="100%" stop-color="#4808FC" stop-opacity="0"/></radialGradient>
<radialGradient id="ovw-sph" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#130D47"/><stop offset="100%" stop-color="#0f2040" stop-opacity="0.4"/></radialGradient>
