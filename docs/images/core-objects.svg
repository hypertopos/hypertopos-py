<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="core-title core-desc">
<title id="core-title">Core objects</title>
<desc id="core-desc">A sphere contains lines of points and defines patterns. A pattern's calibration (μ, σ, θ) turns each entity into a polygon: its edges to other lines and its delta vector. A solid stacks an entity's polygons over time. An alias filters a pattern with a cutting plane.</desc>
<defs>
<linearGradient id="core-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
<radialGradient id="core-glow"><stop offset="0%" stop-color="#4808FC" stop-opacity="0.55"/><stop offset="100%" stop-color="#4808FC" stop-opacity="0"/></radialGradient>
</defs>
<rect width="760" height="340" rx="14" fill="url(#core-bg)" stroke="#230C7C" stroke-width="1.5"/>
<rect x="30" y="25" width="160" height="60" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="110" y="50" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Sphere</text>
<text x="110" y="68" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">top-level container</text>
<rect x="260" y="25" width="160" height="60" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="340" y="50" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Line</text>
<text x="340" y="68" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">versioned entity collection</text>
<rect x="490" y="25" width="160" height="60" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="570" y="50" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Point</text>
<text x="570" y="68" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">single entity record</text>
<line x1="198" y1="55" x2="246.4" y2="55" stroke="#885EFD" stroke-width="1.5"/>
<polygon points="252,55 245,51.15 245,58.85" fill="#885EFD"/>
<text x="225" y="48" font-size="9" fill="#A484FE" font-weight="600" text-anchor="middle" font-style="italic">contains</text>
<line x1="428" y1="55" x2="476.4" y2="55" stroke="#885EFD" stroke-width="1.5"/>
<polygon points="482,55 475,51.15 475,58.85" fill="#885EFD"/>
<text x="455" y="48" font-size="9" fill="#A484FE" font-weight="600" text-anchor="middle" font-style="italic">stores</text>
<rect x="30" y="130" width="160" height="60" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="110" y="155" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pattern</text>
<text x="110" y="173" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">μ, σ, θ calibration</text>
<rect x="260" y="120" width="190" height="80" rx="10" fill="#0f2040" stroke="#6D39FD" stroke-width="2"/>
<text x="355" y="145" font-size="17" fill="#DACEFE" font-weight="700" text-anchor="middle">Polygon</text>
<text x="355" y="163" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">shape + edges + delta</text>
<text x="355" y="178" font-size="9.5" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">δ = (s − μ) ⊘ σ</text>
<text x="355" y="190" font-size="8" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle">current geometric view</text>
<rect x="526" y="116" width="124" height="72" rx="8" fill="none" stroke="#230C7C" stroke-width="0.8" stroke-opacity="0.6"/>
<rect x="523" y="118" width="127" height="76" rx="9" fill="none" stroke="#230C7C" stroke-width="0.8" stroke-opacity="0.8"/>
<rect x="520" y="120" width="130" height="80" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="585" y="145" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Solid</text>
<text x="585" y="163" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">temporal stack</text>
<text x="585" y="178" font-size="9.5" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">τ = (δ₁, …, δₜ)</text>
<text x="585" y="190" font-size="8" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle">history over time</text>
<line x1="198" y1="160" x2="246.4" y2="160" stroke="#885EFD" stroke-width="1.5"/>
<polygon points="252,160 245,156.15 245,163.85" fill="#885EFD"/>
<text x="225" y="152" font-size="9" fill="#A484FE" font-weight="600" text-anchor="middle" font-style="italic">calibrates</text>
<line x1="458" y1="160" x2="506.4" y2="160" stroke="#885EFD" stroke-width="1.5"/>
<polygon points="512,160 505,156.15 505,163.85" fill="#885EFD"/>
<text x="485" y="152" font-size="9" fill="#A484FE" font-weight="600" text-anchor="middle" font-style="italic">over time</text>
<rect x="30" y="245" width="160" height="60" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="110" y="270" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Alias</text>
<text x="110" y="288" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">sub-population filter</text>
<rect x="260" y="245" width="160" height="60" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="340" y="270" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Edge</text>
<text x="340" y="288" font-size="9.5" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">typed relation to another line</text>
<line x1="110" y1="245" x2="110" y2="201.6" stroke="#885EFD" stroke-width="1.4" stroke-dasharray="6,4"/>
<polygon points="110,196 106.15,203 113.85,203" fill="#885EFD"/>
<text x="122" y="225" font-size="9" fill="#A484FE" font-weight="600" font-style="italic">filters</text>
<line x1="340" y1="245" x2="356" y2="206" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5,3" stroke-opacity="0.45"/>
<text x="366" y="232" font-size="9" fill="#FFFFFF" fill-opacity="0.55">part of</text>
<line x1="80" y1="90" x2="80" y2="126" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="5,3" stroke-opacity="0.45"/>
<text x="92" y="112" font-size="9" fill="#FFFFFF" fill-opacity="0.55">defines</text>
<line x1="570" y1="90" x2="400" y2="117" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5,3" stroke-opacity="0.45"/>
<text x="530" y="116" font-size="9" fill="#FFFFFF" fill-opacity="0.55">build geometry</text>
</svg>
