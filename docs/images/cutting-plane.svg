<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="cutp-title cutp-desc">
<title id="cutp-title">Alias cutting plane</title>
<desc id="cutp-desc">An alias cuts a pattern's population with a plane in delta space: entities with w · δ ≥ b form the alias population, the rest are excluded.</desc>
<defs>
<linearGradient id="cutp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
<radialGradient id="cutp-glow"><stop offset="0%" stop-color="#4808FC" stop-opacity="0.55"/><stop offset="100%" stop-color="#4808FC" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="140" rx="14" fill="url(#cutp-bg)" stroke="#230C7C" stroke-width="1.5"/>
<line x1="200" y1="15" x2="200" y2="110" stroke="#6D39FD" stroke-width="1.5" stroke-dasharray="5,3"/>
<circle cx="60" cy="45" r="3.5" fill="#FFFFFF" fill-opacity="0.35"/>
<circle cx="95" cy="60" r="3.5" fill="#FFFFFF" fill-opacity="0.35"/>
<circle cx="75" cy="80" r="3.5" fill="#FFFFFF" fill-opacity="0.35"/>
<circle cx="130" cy="50" r="3" fill="#FFFFFF" fill-opacity="0.3"/>
<circle cx="45" cy="70" r="3" fill="#FFFFFF" fill-opacity="0.3"/>
<circle cx="145" cy="85" r="3" fill="#FFFFFF" fill-opacity="0.3"/>
<circle cx="110" cy="95" r="3" fill="#FFFFFF" fill-opacity="0.25"/>
<circle cx="160" cy="65" r="3" fill="#FFFFFF" fill-opacity="0.25"/>
<circle cx="170" cy="45" r="3" fill="#FFFFFF" fill-opacity="0.3"/>
<circle cx="180" cy="75" r="3" fill="#FFFFFF" fill-opacity="0.25"/>
<text x="110" y="120" font-size="9" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle">w·δ &lt; b</text>
<circle cx="230" cy="50" r="4" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="260" cy="65" r="4" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="245" cy="85" r="4" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="290" cy="55" r="3.5" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="280" cy="90" r="3.5" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="220" cy="70" r="3.5" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="310" cy="75" r="3" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="340" cy="60" r="3" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="325" cy="95" r="3" fill="#885EFD" fill-opacity="0.9"/>
<circle cx="235" cy="40" r="3" fill="#885EFD" fill-opacity="0.9"/>
<text x="285" y="120" font-size="9" fill="#A484FE" font-weight="600" text-anchor="middle">w·δ ≥ b  (alias)</text>
<text x="200" y="133" font-size="8" fill="#A484FE" text-anchor="middle">cutting plane</text>
</svg>
