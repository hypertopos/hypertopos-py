<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="navp-title navp-desc">
<title id="navp-title">Navigation primitives</title>
<desc id="navp-desc">Twelve navigation primitives in three groups. Movement: π1 walk_line, π2 jump_polygon, π3 dive_solid, π4 emerge. Attraction: π5 attract_anomaly, π6 attract_boundary, π7 attract_hub, π8 attract_cluster. Temporal: π9 attract_drift, π10 attract_trajectory, π11 attract_population_compare, π12 attract_regime_change.</desc>
<defs>
<linearGradient id="navp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
<radialGradient id="navp-glow"><stop offset="0%" stop-color="#4808FC" stop-opacity="0.55"/><stop offset="100%" stop-color="#4808FC" stop-opacity="0"/></radialGradient>
</defs>
<rect width="780" height="310" rx="14" fill="url(#navp-bg)" stroke="#230C7C" stroke-width="1.5"/>
<text x="390" y="30" font-size="11" fill="#FFFFFF" fill-opacity="0.55" font-weight="600" text-anchor="middle" letter-spacing="2">NAVIGATION PRIMITIVES</text>
<rect x="24" y="52" width="228" height="236" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="138" y="78" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Movement</text>
<text x="138" y="94" font-size="9" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle">traverse entities and time</text>
<rect x="38" y="108" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="48" y="123" font-size="12" fill="#A484FE" font-weight="700">π1</text>
<text x="78" y="123" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">walk_line</text>
<text x="78" y="137" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">step along a line</text>
<rect x="38" y="151" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="48" y="166" font-size="12" fill="#A484FE" font-weight="700">π2</text>
<text x="78" y="166" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">jump_polygon</text>
<text x="78" y="180" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">cross to a related line</text>
<rect x="38" y="194" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="48" y="209" font-size="12" fill="#A484FE" font-weight="700">π3</text>
<text x="78" y="209" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dive_solid</text>
<text x="78" y="223" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">enter temporal history</text>
<rect x="38" y="237" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="48" y="252" font-size="12" fill="#A484FE" font-weight="700">π4</text>
<text x="78" y="252" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">emerge</text>
<text x="78" y="266" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">return to the surface</text>
<rect x="276" y="52" width="228" height="236" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="390" y="78" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Attraction</text>
<text x="390" y="94" font-size="9" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle">discover population structure</text>
<rect x="290" y="108" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="300" y="123" font-size="12" fill="#A484FE" font-weight="700">π5</text>
<text x="330" y="123" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_anomaly</text>
<text x="330" y="137" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">find outliers</text>
<rect x="290" y="151" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="300" y="166" font-size="12" fill="#A484FE" font-weight="700">π6</text>
<text x="330" y="166" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_boundary</text>
<text x="330" y="180" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">near a segment edge</text>
<rect x="290" y="194" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="300" y="209" font-size="12" fill="#A484FE" font-weight="700">π7</text>
<text x="330" y="209" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_hub</text>
<text x="330" y="223" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">most connected</text>
<rect x="290" y="237" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="300" y="252" font-size="12" fill="#A484FE" font-weight="700">π8</text>
<text x="330" y="252" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_cluster</text>
<text x="330" y="266" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">geometric archetypes</text>
<rect x="528" y="52" width="228" height="236" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="642" y="78" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Temporal</text>
<text x="642" y="94" font-size="9" fill="#FFFFFF" fill-opacity="0.55" text-anchor="middle">track change over time</text>
<rect x="542" y="108" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="552" y="123" font-size="12" fill="#A484FE" font-weight="700">π9</text>
<text x="582" y="123" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_drift</text>
<text x="582" y="137" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">most changed entities</text>
<rect x="542" y="151" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="552" y="166" font-size="12" fill="#A484FE" font-weight="700">π10</text>
<text x="582" y="166" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_trajectory</text>
<text x="582" y="180" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">similar histories</text>
<rect x="542" y="194" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="552" y="209" font-size="12" fill="#A484FE" font-weight="700">π11</text>
<text x="582" y="209" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_population_compare</text>
<text x="582" y="223" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">two time windows</text>
<rect x="542" y="237" width="200" height="36" rx="6" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="552" y="252" font-size="12" fill="#A484FE" font-weight="700">π12</text>
<text x="582" y="252" font-size="9" fill="#DACEFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">attract_regime_change</text>
<text x="582" y="266" font-size="8.5" fill="#FFFFFF" fill-opacity="0.6">structural shifts</text>
</svg>
