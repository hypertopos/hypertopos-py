<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="scal-title scal-desc">
<title id="scal-title">Three scales of navigation</title>
<desc id="scal-desc">Navigation works at three scales: the sphere (sphere_overview, check_alerts, aggregate), the population (π5 to π12) and the single entity (π1 to π4, explain_anomaly, investigate_entity).</desc>
<defs>
<linearGradient id="scal-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1a1a3e"/></linearGradient>
<radialGradient id="scal-glow"><stop offset="0%" stop-color="#4808FC" stop-opacity="0.55"/><stop offset="100%" stop-color="#4808FC" stop-opacity="0"/></radialGradient>
</defs>
<rect width="760" height="380" rx="14" fill="url(#scal-bg)" stroke="#230C7C" stroke-width="1.5"/>
<rect x="35" y="22" width="690" height="72" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="55" y="48" font-size="17" fill="#DACEFE" font-weight="700">Scale 1</text>
<text x="140" y="48" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Sphere — population-level view of the whole domain</text>
<rect x="55" y="62" width="98.5" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="104.25" y="78" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sphere_overview</text>
<rect x="161.5" y="62" width="82" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="202.5" y="78" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">check_alerts</text>
<rect x="251.5" y="62" width="65.5" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="284.25" y="78" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aggregate</text>
<rect x="35" y="138" width="690" height="82" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="55" y="164" font-size="17" fill="#DACEFE" font-weight="700">Scale 2</text>
<text x="140" y="164" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Population — clustering, comparison, drift, hubs, boundaries</text>
<rect x="55" y="178" width="68" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="89" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π5 anomaly</text>
<rect x="131" y="178" width="73.2" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="167.6" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π6 boundary</text>
<rect x="212.2" y="178" width="47.2" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="235.8" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π7 hub</text>
<rect x="267.4" y="178" width="68" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="301.4" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π8 cluster</text>
<rect x="343.4" y="178" width="57.6" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="372.2" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π9 drift</text>
<rect x="409" y="178" width="88.8" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="453.4" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π10 trajectory</text>
<rect x="505.8" y="178" width="73.2" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="542.4" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π11 compare</text>
<rect x="587" y="178" width="68" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="621" y="194" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π12 regime</text>
<rect x="35" y="264" width="690" height="82" rx="10" fill="#0f2040" stroke="#230C7C" stroke-width="1.2"/>
<text x="55" y="290" font-size="17" fill="#DACEFE" font-weight="700">Scale 3</text>
<text x="140" y="290" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Entity — one point, one polygon, one solid, full inspection</text>
<rect x="55" y="304" width="52.4" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="81.2" y="320" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π1 walk</text>
<rect x="115.4" y="304" width="52.4" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="141.6" y="320" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π2 jump</text>
<rect x="175.8" y="304" width="52.4" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="202" y="320" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π3 dive</text>
<rect x="236.2" y="304" width="62.8" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="267.6" y="320" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">π4 emerge</text>
<rect x="307" y="304" width="98.5" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="356.25" y="320" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">explain_anomaly</text>
<rect x="413.5" y="304" width="115" height="24" rx="5" fill="#130D47" stroke="#2F0AA7" stroke-width="0.8"/>
<text x="471" y="320" font-size="9" fill="#DACEFE" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">investigate_entity</text>
<line x1="380" y1="98" x2="380" y2="126.4" stroke="#885EFD" stroke-width="2"/>
<polygon points="380,132 383.85,125 376.15,125" fill="#885EFD"/>
<text x="392" y="120" font-size="10" fill="#A484FE" font-weight="600" font-style="italic">drill down</text>
<line x1="380" y1="224" x2="380" y2="252.4" stroke="#885EFD" stroke-width="2"/>
<polygon points="380,258 383.85,251 376.15,251" fill="#885EFD"/>
<text x="392" y="246" font-size="10" fill="#A484FE" font-weight="600" font-style="italic">inspect</text>
</svg>
